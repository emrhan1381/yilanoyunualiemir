<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09132f">
<title>Kafa Yılanı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell">
<header class="topbar">
<div class="stat"><span>SKOR</span><strong id="score">0000</strong></div>
<div class="stat level"><span>SEVİYE</span><strong id="level">01</strong></div>
<div class="stat best"><span>REKOR</span><strong id="best">0000</strong></div>
</header>
<section class="board-wrap">
<canvas id="game" aria-label="Kafa Yılanı oyunu"></canvas>
<div id="overlay" class="overlay"><div class="panel">
<h1 id="overlay-title">KAFA YILANI</h1>
<p id="overlay-text">Kafaları topla, her kafada 1 kare büyü!</p>
<button id="start-btn">OYUNA BAŞLA</button>
</div></div>
</section>
<div class="controls-row">
<button id="pause-btn" class="secondary">Ⅱ DURAKLAT</button>
<span>Her kafa = +1 kare</span>
<button id="restart-btn" class="secondary">↻ YENİLE</button>
</div>
<div class="mobile-controls" aria-label="Dokunmatik yön tuşları">
<button data-dir="up" aria-label="Yukarı">▲</button>
<div class="middle-controls">
<button data-dir="left" aria-label="Sol">◀</button>
<button data-dir="down" aria-label="Aşağı">▼</button>
<button data-dir="right" aria-label="Sağ">▶</button>
</div></div>
<p class="hint">Bilgisayarda yön tuşları / WASD • Telefonda ekrandaki tuşlar</p>
</main>
<script src="script.js"></script>
</body>
</html>
